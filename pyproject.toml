[project]
name = "mempalace-rpg"
version = "0.1.0"
description = "RPG-focused narrative memory kernel and MCP server adapted from MemPalace."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "mempalace-rpg contributors" }]
keywords = ["rpg", "memory", "mcp", "npc", "narrative", "mempalace", "sillytavern"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "chromadb>=1.5.4,<2",
  "huggingface_hub>=0.20",
  "numpy>=1.24",
  "python-dateutil>=2.8",
  "pyyaml>=6.0,<7",
  "tokenizers>=0.15",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/TohmaN233/mempalace-rpg"
Repository = "https://github.com/TohmaN233/mempalace-rpg"
Upstream-MemPalace = "https://github.com/MemPalace/mempalace"

[project.scripts]
mempalace = "mempalace.cli:main"
mempalace-mcp = "mempalace.mcp_proxy:main"
mempalace-rpg = "mempalace_rpg.cli:main"
mempalace-rpg-mcp = "mempalace_rpg.mcp_server:main"

[project.entry-points."mempalace.backends"]
chroma = "mempalace.backends.chroma:ChromaBackend"
milvus = "mempalace.backends.milvus:MilvusBackend"
pgvector = "mempalace.backends.pgvector:PgVectorBackend"
qdrant = "mempalace.backends.qdrant:QdrantBackend"
sqlite_exact = "mempalace.backends.sqlite_exact:SQLiteExactBackend"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff==0.15.15",
]
benchmark = [
  "ijson>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mempalace_rpg", "mempalace"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
